name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test against ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: varnish
            bootstrap: curl -Ls https://packages.varnish-software.com/varnish/bootstrap-deb.sh | sudo bash
            packages: varnish varnish-dev
          - name: varnish-plus
            bootstrap: curl -s https://packagecloud.io/install/repositories/varnishplus/60-enterprise/script.deb.sh | sudo INSTALL= bash
            packages: varnish-plus varnish-plus-dev
            test_tags: -tags varnish_plus

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Disable shared build cache: OSS and Plus compile CGo against different
          # headers; sharing the cache causes the Plus job to use OSS-compiled artifacts.
          cache: false

      - name: Install Varnish
        run: |
          ${{ matrix.bootstrap }}
          sudo apt-get update -qq
          sudo apt-get install -qq ${{ matrix.packages }}
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ${{ matrix.test_tags }} -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.name == 'varnish'
        run: go tool cover -func=coverage.out | tail -1

      - name: Coverage report
        if: matrix.name == 'varnish'
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage
        if: matrix.name == 'varnish'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.html

      - name: golangci-lint
        if: matrix.name == 'varnish'
        uses: golangci/golangci-lint-action@v9
